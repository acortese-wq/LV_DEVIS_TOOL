*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
header.top{background:var(--navy);color:#fff;padding:14px 20px 0}
.toprow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;max-width:1440px;margin:0 auto}
.brand h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:13px;opacity:.75}
.head{display:flex;flex-wrap:wrap;gap:10px 14px;flex:1;align-items:flex-end}
.head label{display:flex;flex-direction:column;font-size:12px;opacity:.95;gap:3px}
.head input[type=text],.head select{background:#fff;color:#16203a;border:0;border-radius:3px;padding:5px 8px;min-width:130px}
.head .wide{min-width:220px}
.head .chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;padding-bottom:6px}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.tools button,.tools select{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:3px;padding:5px 10px;cursor:pointer}
.tools select option{color:#16203a}
.tools button:hover{background:rgba(255,255,255,.12)}
nav.tabs{display:flex;gap:2px;max-width:1440px;margin:12px auto 0;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:rgba(255,255,255,.1);color:#dfe6ff;padding:9px 16px 10px;border-radius:4px 4px 0 0;cursor:pointer;font-weight:600;font-size:14px}
nav.tabs button.on{background:var(--paper);color:var(--ink)}
nav.tabs button.sep{margin-left:14px}
nav.tabs .cnt{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;line-height:17px;text-align:center}
main{max-width:1440px;margin:0 auto;padding:18px 20px 30px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:18px;align-items:start}
main.full{grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.cardhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:2px solid var(--navy)}
.cardhead h2{margin:0;font-size:19px;flex:1 1 auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.del{color:var(--warn)}
.body{padding:14px 16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fld>span{font-weight:600}
.fld input[type=number],.fld input[type=text],.fld select,.lst select,.lst input,.ind input{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:5px 8px;color:var(--ink);min-width:0}
.fld.key input{background:var(--input);border-color:var(--inputline)}
.fld input:disabled,.fld select:disabled{opacity:.45}
.fld em{font-style:normal;font-size:12px}
.row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px 14px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.row>.lbl{font-weight:600;font-size:13px;color:var(--muted);padding-top:6px}
.row .inline{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.row .inline .fld{width:150px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer;background:var(--surface);color:var(--ink);font-size:14px}
.seg label:has(input:checked){border-color:var(--blue);background:var(--sel)}
.seg label.dis{opacity:.4;cursor:not-allowed}
.chks{display:flex;flex-wrap:wrap;gap:8px 18px}
.chks label{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-size:14px}
.range{font-size:12px;color:var(--muted);margin-top:4px}
.range.bad{color:var(--warn);font-weight:600}
.typ{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 16px;font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.typ b{color:var(--ink);display:block;font-size:13px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin:6px 0 14px}
.lst{border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.lh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.lr{display:grid;grid-template-columns:minmax(0,1fr) 76px 30px;gap:6px;margin-bottom:5px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;color:var(--warn);font-weight:700}
.addrow{border:1px dashed var(--line);background:transparent;border-radius:3px;padding:3px 10px;cursor:pointer;color:var(--blue);font-size:13px}
.ind{margin-top:16px;border-top:2px solid var(--line);padding-top:12px}
.ind h3{margin:0 0 8px;font-size:15px}
.ir{display:grid;grid-template-columns:minmax(0,1fr) 90px 30px;gap:6px;margin-bottom:5px}
.ir.free{grid-template-columns:minmax(0,1fr) 60px 80px 80px 30px}
.ir small{grid-column:1/-1;color:var(--muted);margin-top:-3px}
aside{position:sticky;top:10px}
.panel h3{margin:0;font-size:15px;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .n{text-align:right;white-space:nowrap}
.tbl .pos{white-space:nowrap;font-weight:600}
.tbl tr.w td{background:var(--warnbg)}
.tbl tr.w .pos{color:var(--warn)}
.tbl tr.bel .pos::after{content:" B";font-size:10px;color:var(--blue);vertical-align:super}

.tbl tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.scroll{max-height:62vh;overflow:auto}

.tot div.sep{color:var(--muted)}
.sumbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}

.maplist{font-size:12.5px;columns:2 360px;column-gap:28px}

.maplist b{color:var(--ink)}
.maplist span{color:var(--muted)}

.hres div.big{font-weight:700;font-size:16px;border-bottom:3px double var(--ink)}

</style>

function calcRec(tab,r,noBE){
 const ks=tab==='belag'?'Belag':tab==='hon'?'HON':'TB',c=Ctx(t('tab_'+tab)+': '+(r.bez||'–'),ks);
 try{CALC[tab](r,c,noBE)}catch(e){c.notes.push('Rechenfehler: '+e.message)}
 for(const p in r.x||{})if(LV[p])c.L(p,num(r.x[p]));
 (r.ind||[]).forEach(x=>{if(x.p&&LV[x.p])c.L(x.p,num(x.q))});
 (r.free||[]).forEach(x=>{const q=num(x.q);if(q>0&&x.t)c.lines.push({p:'',t:x.t,u:x.u||'',q:r2(q),ep:num(x.ep),src:c.src,ks,w:1})});
 c.lines.forEach(l=>l.amt=r2(l.q*l.ep));
 return c;
}
function calcSet(tabs,noBE){const all=[],notes=[];tabs.forEach(tb=>S.recs[tb].forEach(r=>{const c=calcRec(tb,r,noBE);all.push(...c.lines);c.notes.forEach(n=>notes.push(c.src+': '+n))}));return {all,notes}}

function beBase(){return r2(calcSet(LVTABS,true).all.filter(l=>S.head.belMit||l.ks!=='Belag').reduce((s,l)=>s+l.amt,0))}

function XT(p){const c=p.slice(0,3),u=p.slice(4,7);
 if(c==='111')return 'allg';
 if(c==='113')return u==='214'?'graben':'allg';
 if(c==='117')return u==='223'?'belag':u==='228'?'schacht':'graben';
 if(c==='151'){if(u==='672')return 'geb';if(u[0]==='6')return 'schacht';if(u==='471')return 'graben';if(u[0]==='4')return 'rohr';
  if(['121','122','231','232','234'].includes(u))return 'werkloch';return 'graben'}
 if(c==='222')return 'graben';
 if(c==='223')return ['921','926'].includes(u)?'schacht':'belag';
 return 'allg'}

 AUTO=new Set(src.match(/\d{3}\/\d{3}\.\d{3}/g));[1,2,3,4].forEach(n=>{AUTO.add('223/221.10'+n);AUTO.add('223/222.12'+n)});return AUTO}

function totals(all){
 const hon=all.filter(l=>l.ks==='HON'),lv=all.filter(l=>l.ks!=='HON');
 const inc=S.head.belMit?lv:lv.filter(l=>l.ks!=='Belag');

 const z=r2(inc.reduce((s,l)=>s+l.amt,0)),[st,pc,ins]=stage(z),rb=r2(z*pc/100),nr=r2(z-rb),inst=z>0?ins:0,net=r2(nr+inst),mw=r2(net*S.P.mwst/100);
 return {inc,sep,z,st,pc,rb,nr,inst,net,mw,br:r2(net+mw),sepSum:r2(sep.reduce((s,l)=>s+l.amt,0)),hon,hNet,hMw,hBr:r2(hNet+hMw)};

document.addEventListener('click',async e=>{
 const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;save();renderTabs();renderMain();window.scrollTo({top:0});return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,r=S.tab in S.recs?rec():null;
 if(a==='new'){S.recs[S.tab].push(newRec(S.tab,S.recs[S.tab].length+1));S.idx[S.tab]=S.recs[S.tab].length-1;toast(t('autosave'))}
 else if(a==='dup'){const cp=JSON.parse(JSON.stringify(r));cp.bez=(cp.bez||'')+' ('+t('copy')+')';S.recs[S.tab].splice(S.idx[S.tab]+1,0,cp);S.idx[S.tab]++;toast(t('autosave'))}
 else if(a==='prev')S.idx[S.tab]=Math.max(0,S.idx[S.tab]-1);
 else if(a==='next')S.idx[S.tab]=Math.min(S.recs[S.tab].length-1,S.idx[S.tab]+1);
 else if(a==='del'){const l=S.recs[S.tab];l.splice(S.idx[S.tab],1);if(!l.length)l.push(newRec(S.tab,1));S.idx[S.tab]=Math.min(S.idx[S.tab],l.length-1)}
 else if(a==='addrow'){getP(r,b.dataset.k).push({typ:'',q:0})}
 else if(a==='rmrow'){getP(r,b.dataset.k).splice(+b.dataset.i,1)}
 else if(a==='indiv'||a==='addind'){r.ind.push({p:'',q:0});save();renderMain();renderTabs();const ib=document.querySelectorAll('#indBlock .ir:not(.free) input[list]');if(ib.length){ib[ib.length-1].focus();ib[ib.length-1].scrollIntoView({block:'center'})}return}
 else if(a==='addfree'){r.free.push({t:'',u:'',ep:0,q:0})}
 else if(a==='csv'){exportCSV();return}
 else if(a==='print'){window.print();return}
 else return;
 save();renderMain();renderTabs();
});
$('#bNew').onclick=()=>{if(confirm(t('confirmNew'))){const l=S.lang;S=defaults();S.lang=l;save();renderAll()}};
$('#bLoad').onclick=()=>$('#fLoad').click();
$('#bSave').onclick=()=>download('LV-Erfassung_'+(S.head.sap||'Projekt')+'.json',JSON.stringify(S,null,1),'application/json');
async function download(name,data,type){
 let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:name,data:new Blob([data],{type})})}catch(err){if(err&&err.code!=='declined')toast(t('dlNo'))}return}
 try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast(t('dlNo'))}
}
function exportCSV(){
 const {all}=calcAll(),T=totals(all),rows=[[t('cNpk'),t('cText'),t('cSrc'),'KS',t('cQ'),t('cU'),t('cEp'),t('cAmt')]];
 all.forEach(l=>rows.push([l.p||'SONDER',l.t,l.src,l.ks==='Belag'?'Belag':l.ks==='HON'?'Honorar':'Tiefbau',l.q,l.u,l.ep,l.amt]));
 rows.push([]);[[t('zws'),T.z],[t('rab')+' '+T.pc+' %',-T.rb],[t('inst'),T.inst],[t('netto'),T.net],[t('mwst'),T.mw],[t('brutto'),T.br]].concat(T.hon.length?[[t('hTot'),T.hNet],[t('hTotI'),T.hBr],[t('gTot'),r2(T.br+T.hBr)]]:[]).forEach(([a,b])=>rows.push(['',a,'','','','','',b]));
 const csv='\ufeff'+rows.map(r=>r.map(v=>typeof v==='number'?String(v).replace('.',','):'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
 download('LV-Erfassung_'+(S.head.sap||'Projekt')+'.csv',csv,'text/csv');
}
$('#lvlist').innerHTML=Object.entries(LV).map(([k,d])=>`<option value="${k}">${esc(d[0]+' – '+d[1]+' ('+d[2]+', '+fmt(d[3])+')')}</option>`).join('');
renderAll();
</script>
